<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px; height: 1500px;
    font-family: 'Crimson Pro', Georgia, serif;
    color: #F5F0E8;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg {
    position: absolute; inset: 0;
    background: url('church-of-the-king-e6ZlCzBnGWI-unsplash.jpg') center/cover;
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(28,20,10,0.45) 0%, rgba(28,20,10,0.55) 50%, rgba(28,20,10,0.7) 100%);
  }
  .content {
    position: relative; z-index: 1;
    text-align: center; max-width: 820px;
    padding: 0 60px;
  }
  .label {
    font-family: 'Work Sans', sans-serif;
    font-size: 24px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: #D4C4A8; margin-bottom: 40px;
  }
  .title {
    font-size: 100px; font-weight: 600;
    line-height: 1.06; letter-spacing: -0.01em;
    margin-bottom: 35px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .hook {
    font-size: 42px; line-height: 1.4;
    font-style: italic; color: #D4C4A8;
    margin-bottom: 50px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.25);
  }
  .divider {
    width: 60px; height: 2px; background: #D4C4A8;
    margin: 0 auto 50px; opacity: 0.7;
  }
  .points {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 25px 45px; max-width: 750px;
  }
  .points span {
    font-size: 34px; color: #D4C4A8;
  }
  .points span::before { content: "· "; font-weight: bold; }
  .bottom-bar {
    position: absolute; bottom: 50px; left: 0; right: 0; z-index: 1;
    text-align: center;
    font-family: 'Work Sans', sans-serif; font-size: 22px;
    color: #D4C4A8; text-transform: uppercase; letter-spacing: 0.12em;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg"></div>
<div class="overlay"></div>
<div class="content">
  <p class="label">Printable Guide</p>
  <h1 class="title">A Simple Life</h1>
  <p class="hook">A guide to doing less, with more intention.</p>
  <div class="divider"></div>
  <div class="points">
    <span>Practical Swaps for Kitchen &amp; Home</span>
    <span>The Diaper Bag Rule Explained</span>
    <span>Turn Down the Noise of Social Media</span>
    <span>Printable PDF &middot; 9 Pages</span>
  </div>
</div>
<div class="bottom-bar">Kitchen &amp; Kettle</div>
</body>
</html>
