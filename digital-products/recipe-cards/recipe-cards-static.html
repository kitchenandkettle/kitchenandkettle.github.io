<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Card — Kitchen & Kettle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F5F0E8;--ink:#2C2416;--clay:#C4A882;--sage:#7D8B6F;--muted:#8B8376;--line:#D9D0C1}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Crimson Pro',Georgia,serif;
    background:#fff;
    color:var(--ink);
  }
  .page{
    width:8.5in;min-height:11in;
    background:var(--paper);
    padding:0.6in 0.75in 0.6in 0.9in;
    position:relative;
    display:flex;flex-direction:column;
  }
  .page-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:0.25in;margin-bottom:0.25in;
    border-bottom:2px solid var(--clay);
  }
  .page-header .brand{
    font-family:'Work Sans',sans-serif;
    font-size:9pt;font-weight:600;
    text-transform:uppercase;letter-spacing:0.1em;
    color:var(--clay);
  }
  .page-header .brand em{font-style:italic;color:var(--sage)}
  .page-header .meta{
    font-family:'Work Sans',sans-serif;
    font-size:8pt;color:var(--muted);
  }
  .recipe-title{
    font-family:'Crimson Pro',serif;
    font-size:28pt;font-weight:600;
    color:var(--ink);
    margin-bottom:0.15in;
    padding:0.05in 0;
    border-bottom:1px dashed var(--line);
    min-height:0.55in;
  }
  .time-row{
    display:flex;gap:0.3in;margin-bottom:0.25in;
    font-family:'Work Sans',sans-serif;font-size:9pt;
  }
  .time-field{
    display:flex;align-items:baseline;gap:0.1in;
  }
  .time-field label{
    font-weight:600;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--sage);
  }
  .time-field .write-line{
    width:1.2in;
    border-bottom:1px dashed var(--line);
    padding:0.02in 0;
  }
  .two-col{
    display:flex;gap:0.3in;flex:1;min-height:0;
    align-items:flex-start;
  }
  .col-ingredients{width:2.8in;flex-shrink:0}
  .col-instructions{flex:1;min-width:0}
  .section-label{
    font-family:'Work Sans',sans-serif;
    font-size:9pt;font-weight:600;
    text-transform:uppercase;letter-spacing:0.08em;
    color:var(--sage);
    margin-bottom:0.1in;padding-bottom:0.05in;
    border-bottom:1px solid var(--line);
  }
  .ingredients-list{
    list-style:none;padding:0;
    font-size:11pt;line-height:1.6;
    display:flex;flex-direction:column;gap:0.28in;
    padding-top:0.05in;
  }
  .ingredients-list .write-line{
    border-bottom:1px dashed var(--line);
  }
  .instructions-lines{
    font-size:11pt;line-height:1.6;
    display:flex;flex-direction:column;gap:0.28in;
    padding-top:0.14in;
  }
  .instructions-lines .write-line{
    border-bottom:1px dashed var(--line);
  }
  .notes-section{
    margin-top:auto;padding-top:0.15in;
    border-top:1px solid var(--line);
  }
  .notes-lines{
    display:flex;flex-direction:column;gap:0.18in;
    padding-top:0.05in;
  }
  .notes-lines .write-line{
    border-bottom:1px dashed var(--line);
  }
  .page-footer{
    margin-top:0.15in;padding-top:0.15in;
    text-align:center;
    font-family:'Work Sans',sans-serif;font-size:7pt;
    color:var(--muted);letter-spacing:0.05em;
    text-transform:uppercase;
  }
  .page-footer em{font-style:italic;color:var(--clay)}
</style>
</head>
