<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe — Kitchen & Kettle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F5F0E8;--ink:#2C2416;--clay:#C4A882;--sage:#7D8B6F;--muted:#8B8376;--line:#D9D0C1}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Crimson Pro',Georgia,serif;
    background:#e8e4dc;
    display:flex;flex-direction:column;align-items:center;padding:1rem;
    color:var(--ink);
  }
  .toolbar{
    max-width:8.5in;width:100%;margin:0 auto 0.5rem;
    display:flex;justify-content:space-between;align-items:center;
    background:#fff;padding:0.5rem 0.7rem;border-radius:6px;
    box-shadow:0 1px 4px rgba(44,36,22,0.08);
    position:sticky;top:0;z-index:100;
  }
  .toolbar .brand{font-family:'Crimson Pro',serif;font-size:14pt;font-weight:600;color:var(--ink)}
  .toolbar .brand em{font-style:italic;color:var(--clay)}
  .toolbar .actions{display:flex;gap:0.5rem;align-items:center}
  .btn{
    font-family:'Work Sans',sans-serif;font-size:8pt;font-weight:600;
    padding:0.4em 0.8em;border-radius:3px;cursor:pointer;border:none;
    transition:background 0.15s;text-decoration:none;
  }
  .btn-ghost{background:none;color:var(--muted);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink)}
  .btn-print{background:var(--ink);color:var(--paper)}
  .btn-print:hover{background:#3D362D}
  .save-status{
    font-family:'Work Sans',sans-serif;font-size:8pt;color:#5a8a6a;
    margin-right:0.5rem;opacity:0;transition:opacity 0.3s;
  }
  .save-status.visible{opacity:1}

  .page{
    width:8.5in;min-height:11in;
    background:var(--paper);
    padding:0.6in 0.75in 0.6in 0.9in;
    box-shadow:0 2px 12px rgba(44,36,22,0.12);
    position:relative;
  }
  .page-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:0.25in;margin-bottom:0.25in;
    border-bottom:2px solid var(--clay);
  }
  .page-header .brand{
    font-family:'Work Sans',sans-serif;
    font-size:9pt;font-weight:600;
    text-transform:uppercase;letter-spacing:0.1em;
    color:var(--clay);
  }
  .page-header .brand em{font-style:italic;color:var(--sage)}
  .page-header .meta{
    font-family:'Work Sans',sans-serif;
    font-size:8pt;color:var(--muted);
    text-align:right;
  }

  .recipe-title-row{
    display:flex;align-items:baseline;gap:0.15in;
    margin-bottom:0.15in;
  }
  .recipe-title-row label{
    font-family:'Work Sans',sans-serif;font-size:9pt;
    font-weight:600;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--sage);
    white-space:nowrap;flex-shrink:0;
  }
  .recipe-title{
    flex:1;
    font-family:'Crimson Pro',serif;
    font-size:28pt;font-weight:600;
    color:var(--ink);
    border:none;background:transparent;
    width:100%;outline:none;
    padding:0.05in 0;
    border-bottom:1px dashed var(--line);
  }
  .recipe-title:focus{border-bottom-color:var(--clay)}
  .recipe-title::placeholder{color:var(--muted);font-style:italic}

  .time-row{
    display:flex;gap:0.3in;margin-bottom:0.25in;
    font-family:'Work Sans',sans-serif;font-size:9pt;
  }
  .time-field{
    display:flex;align-items:baseline;gap:0.1in;
  }
  .time-field label{
    font-weight:600;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--sage);
    white-space:nowrap;
  }
  .time-field input{
    border:none;background:transparent;
    font-family:'Crimson Pro',serif;font-size:12pt;
    color:var(--ink);width:1.2in;outline:none;
    border-bottom:1px dashed var(--line);
    padding:0.02in 0;
  }
  .time-field input:focus{border-bottom-color:var(--clay)}

  .two-col{
    display:flex;gap:0.3in;flex:1;min-height:0;
    align-items:flex-start;
  }
  .col-ingredients{width:2.8in;flex-shrink:0}
  .col-instructions{flex:1;min-width:0}

  .section-label{
    font-family:'Work Sans',sans-serif;
    font-size:9pt;font-weight:600;
    text-transform:uppercase;letter-spacing:0.08em;
    color:var(--sage);
    margin-bottom:0.1in;padding-bottom:0.05in;
    border-bottom:1px solid var(--line);
  }
  .ingredients-list{
    list-style:none;padding:0;
    font-size:11pt;line-height:1.6;
    display:flex;flex-direction:column;gap:0.28in;
    padding-top:0.14in;
  }
  .ingredients-list li{
    display:flex;align-items:baseline;gap:0.15in;
  }
  .ingredients-list li .bullet{
    color:var(--clay);font-size:8pt;
    flex-shrink:0;
  }
  .ingredients-list li input{
    border:none;background:transparent;
    font-family:'Crimson Pro',serif;font-size:11pt;
    color:var(--ink);width:100%;outline:none;
    border-bottom:1px dashed transparent;
  }
  .ingredients-list li input:focus{border-bottom-color:var(--line)}
  .ingredients-list li input::placeholder{color:var(--muted);font-style:italic}

  .instructions-area{
    width:100%;min-height:4.5in;
    border:none;background:transparent;
    font-family:'Crimson Pro',serif;font-size:11pt;
    color:var(--ink);line-height:1.6;
    resize:none;outline:none;
    padding:0.05in 0;
  }
  .instructions-area:focus{}
  .instructions-area::placeholder{color:var(--muted);font-style:italic}

  .notes-section{
    margin-top:auto;padding-top:0.45in;
  }
  .notes-area{
    width:100%;min-height:0.8in;
    border:none;background:transparent;
    font-family:'Crimson Pro',serif;font-size:10pt;
    color:var(--muted);line-height:1.5;
    resize:none;outline:none;
  }
  .notes-area::placeholder{color:var(--line);font-style:italic}

  .kettle-logo{
    text-align:center;margin-top:0.15in;
  }

  .page-footer{
    margin-top:auto;padding-top:0.15in;
    text-align:center;
    font-family:'Work Sans',sans-serif;font-size:7pt;
    color:var(--muted);letter-spacing:0.05em;
    text-transform:uppercase;
  }
  .page-footer em{font-style:italic;color:var(--clay)}

  @media print{
    body{background:none;padding:0;margin:0}
    .toolbar{display:none}
    .page{margin:0;box-shadow:none}
    input,textarea{border-bottom-color:transparent!important}
    input::placeholder,textarea::placeholder{color:transparent!important}
  }
</style>
</head>
<body>
<div class="toolbar">
  <div class="brand">Kitchen <em>&amp; Kettle</em></div>
  <div class="actions">
    <span class="save-status" id="saveStatus">Saved</span>
    <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
    <button class="btn btn-ghost" onclick="addRecipe()">+ New Recipe</button>
    <button class="btn btn-print" onclick="window.print()">Print</button>
  </div>
</div>

<div id="pages"></div>

<template id="recipePage">
<div class="page">
  <div class="page-header">
    <div class="brand">Kitchen <em>&amp; Kettle</em></div>
    <div class="meta">Recipe Card</div>
  </div>

  <div class="recipe-title-row"><label>Recipe</label><input class="recipe-title" type="text" placeholder="Recipe name" data-key="title"></div>

  <div class="time-row">
    <div class="time-field">
      <label>Prep</label>
      <input type="text" placeholder="—" data-key="prep">
    </div>
    <div class="time-field">
      <label>Cook</label>
      <input type="text" placeholder="—" data-key="cook">
    </div>
    <div class="time-field">
      <label>Total</label>
      <input type="text" placeholder="—" data-key="total">
    </div>
  </div>

  <div class="two-col">
    <div class="col-ingredients">
      <div class="section-label">Ingredients</div>
      <ul class="ingredients-list" data-key="ingredients">
        <li><span class="bullet">&#9679;</span><input type="text" placeholder="Ingredient"></li>
        <li><span class="bullet">&#9679;</span><input type="text" placeholder="Ingredient"></li>
        <li><span class="bullet">&#9679;</span><input type="text" placeholder="Ingredient"></li>
        <li><span class="bullet">&#9679;</span><input type="text" placeholder="Ingredient"></li>
        <li><span class="bullet">&#9679;</span><input type="text" placeholder="Ingredient"></li>
        <li><span class="bullet">&#9679;</span><input type="text" placeholder="Ingredient"></li>
        <li><span class="bullet">&#9679;</span><input type="text" placeholder="Ingredient"></li>
        <li><span class="bullet">&#9679;</span><input type="text" placeholder="Ingredient"></li>
      </ul>
    </div>
    <div class="col-instructions">
      <div class="section-label">Instructions</div>
      <textarea class="instructions-area" placeholder="Write your instructions here&hellip;" data-key="instructions"></textarea>
    </div>
  </div>

  <div class="notes-section">
    <div class="section-label">Notes</div>
    <textarea class="notes-area" placeholder="Substitutions, tips, where this recipe came from&hellip;" data-key="notes"></textarea>
  </div>

  <div class="kettle-logo"><img src="kettle-logo.svg" alt="" style="height:0.8in;"></div>
  <div class="page-footer">Kitchen <em>&amp; Kettle</em> &bull; Works because it works.</div>
</div>
</template>

<script>
const STORAGE_KEY = 'kettle-recipe-cards';

function save(){
  const pages = [];
  document.querySelectorAll('#pages .page').forEach((page,i) => {
    const data = {};
    page.querySelectorAll('[data-key]').forEach(el => {
      if(el.tagName === 'UL'){
        data[el.dataset.key] = Array.from(el.querySelectorAll('input')).map(inp => inp.value).filter(v => v);
      } else {
        data[el.dataset.key] = el.tagName === 'TEXTAREA' ? el.value : el.value;
      }
    });
    pages.push(data);
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
  const s = document.getElementById('saveStatus');
  s.classList.add('visible');
  clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove('visible'), 1500);
}

function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return addRecipe();
  const pages = JSON.parse(raw);
  if(!pages.length) return addRecipe();
  pages.forEach((data,i) => {
    addRecipe();
    const page = document.querySelectorAll('#pages .page')[i];
    if(!page) return;
    page.querySelectorAll('[data-key]').forEach(el => {
      const key = el.dataset.key;
      if(!(key in data)) return;
      if(el.tagName === 'UL'){
        const vals = data[key];
        const inputs = el.querySelectorAll('input');
        vals.forEach((v,j) => { if(inputs[j]) inputs[j].value = v; });
      } else if(el.tagName === 'TEXTAREA'){
        el.value = data[key];
      } else if(el.tagName === 'INPUT'){
        el.value = data[key];
      }
    });
  });
}

function addRecipe(){
  const tmpl = document.getElementById('recipePage');
  const clone = tmpl.content.cloneNode(true);
  document.getElementById('pages').appendChild(clone);
}

function clearAll(){
  if(!confirm('Clear all recipes and start fresh?')) return;
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('pages').innerHTML = '';
  addRecipe();
}

document.addEventListener('input', save);
load();
</script>
</body>
</html>
